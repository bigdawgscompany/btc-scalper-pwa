<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />

  <!-- Grid lines -->
  <path d="M 64 256 H 448 M 64 384 H 448 M 64 128 H 448 M 256 64 V 448" stroke="#27272a" stroke-width="3" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Candlesticks motif in background -->
  <!-- Candle 1: Red -->
  <line x1="120" y1="180" x2="120" y2="340" stroke="#f43f5e" stroke-width="4" opacity="0.6" />
  <rect x="108" y="210" width="24" height="90" rx="4" fill="#f43f5e" opacity="0.7" />

  <!-- Candle 2: Green -->
  <line x1="180" y1="140" x2="180" y2="380" stroke="#10b981" stroke-width="4" opacity="0.6" />
  <rect x="168" y="190" width="24" height="130" rx="4" fill="#10b981" opacity="0.8" />

  <!-- Candle 3: Green large breakout -->
  <line x1="390" y1="100" x2="390" y2="320" stroke="#10b981" stroke-width="4" opacity="0.6" />
  <rect x="378" y="130" width="24" height="120" rx="4" fill="#10b981" opacity="0.8" />

  <!-- Central Glow Ring -->
  <circle cx="280" cy="270" r="110" fill="#f59e0b" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="280" cy="270" r="95" fill="url(#btcGrad)" stroke="#fbbf24" stroke-width="6" />

  <!-- Bitcoin Symbol -->
  <path d="M 286 210 V 195 M 274 210 V 195 M 286 345 V 330 M 274 345 V 330 M 255 210 H 290 C 305 210 315 218 315 235 C 315 248 306 256 295 260 C 310 264 322 274 322 292 C 322 312 308 322 288 322 H 255 V 210 Z M 276 253 H 289 C 297 253 302 248 302 241 C 302 234 297 228 289 228 H 276 V 253 Z M 276 304 H 292 C 301 304 307 298 307 289 C 307 280 301 274 292 274 H 276 V 304 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Scalper Pulse Wave -->
  <path d="M 64 380 L 130 360 L 190 390 L 260 310 L 330 350 L 420 180 L 448 200" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="420" cy="180" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4" />
</svg>
